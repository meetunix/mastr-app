# Default values for mastr-app.
# These mirror the docker-compose.yaml setup.

replicaCount: 1

image:
  repository: mastr-app
  tag: latest
  # imagePullPolicy is intentionally unset so Kubernetes applies its default:
  #   Always        for :latest (or no tag)
  #   IfNotPresent  for any other tag
  pullPolicy: ""

service:
  type: ClusterIP
  port: 8080
  # Port the container listens on (Apache in the image).
  targetPort: 8080

# Environment variables consumed by the app.
# MASTR_STATIC_PUBLIC_URL is left empty by default and must be set to the
# public-facing URL of the static exports (e.g. via --set or a parent chart);
# the chart refuses to render without it.
# MASTR_APP_URL (optional) is the URL shown in the startup banner of the
# container log; by default it is derived from the ingress hosts, without
# ingress the banner shows http://localhost:8081.
env:
  MASTR_STATIC_URL: https://mastr-static.nachtsieb.de
  MASTR_STATIC_PUBLIC_URL: ""
  # MASTR_APP_URL: https://mastr-app.example.com
  # public URL of the tile server (martin in mastr-tool), shown on the page
  # "Tile-Server"; without it the page names the public instance
  # MASTR_TILES_PUBLIC_URL: https://mastr-tiles.example.com

# Read-only connection to the database of mastr-tool. The maps page reads all
# its data from it; without database.host it only shows a message (tables
# and downloads use the exports and work without database).
database:
  # e.g. the Service of the mastr-tool chart: <release>-mastr-tool-db
  host: ""
  port: 5432
  name: mastr
  # Secret with the credentials (required with database.host), e.g. the one
  # of the mastr-tool chart (<release>-mastr-tool-db) or one for a read-only role
  existingSecret: ""
  existingSecretUserKey: username
  existingSecretPasswordKey: password

# Ingress for exposing mastr-app outside the cluster.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: mastr.local
      paths:
        - path: /
          pathType: Prefix
  tls: []

# The app keeps parsed tables in memory (bounded to about 512 MiB) and builds
# large responses for the biggest tables, so memory is limited explicitly.
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

# Both probes request the start page, which is cheap to render.
livenessProbe:
  httpGet:
    path: /
    port: http
  periodSeconds: 20
  timeoutSeconds: 10
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /
    port: http
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector: {}

tolerations: []

affinity: {}
