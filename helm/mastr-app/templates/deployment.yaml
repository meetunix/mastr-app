apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app.kubernetes.io/name: {{ .Chart.Name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- with .Values.image.pullPolicy }}
          imagePullPolicy: {{ . }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
              protocol: TCP
          env:
            - name: MASTR_STATIC_URL
              value: {{ .Values.env.MASTR_STATIC_URL | quote }}
            - name: MASTR_STATIC_PUBLIC_URL
              value: {{ required "env.MASTR_STATIC_PUBLIC_URL must be set" .Values.env.MASTR_STATIC_PUBLIC_URL | quote }}
            {{- /* public URL of the tile server, shown on the page "Tile-Server" */}}
            {{- with .Values.env.MASTR_TILES_PUBLIC_URL }}
            - name: MASTR_TILES_PUBLIC_URL
              value: {{ . | quote }}
            {{- end }}
            {{- /* URLs for the startup banner: env.MASTR_APP_URL or the ingress hosts */}}
            {{- $appUrls := list }}
            {{- if .Values.env.MASTR_APP_URL }}
            {{- $appUrls = list .Values.env.MASTR_APP_URL }}
            {{- else if .Values.ingress.enabled }}
            {{- range .Values.ingress.hosts }}
            {{- $host := .host }}
            {{- $scheme := "http" }}
            {{- range $.Values.ingress.tls }}
            {{- if has $host .hosts }}
            {{- $scheme = "https" }}
            {{- end }}
            {{- end }}
            {{- $appUrls = append $appUrls (printf "%s://%s" $scheme $host) }}
            {{- end }}
            {{- end }}
            {{- with $appUrls }}
            - name: MASTR_APP_URL
              value: {{ join "," . | quote }}
            {{- end }}
            {{- /* database of mastr-tool (maps page) */}}
            {{- with .Values.database }}
            {{- if .host }}
            - name: DB_HOST
              value: {{ .host | quote }}
            - name: DB_PORT
              value: {{ .port | default 5432 | quote }}
            - name: DB_NAME
              value: {{ .name | default "mastr" | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ required "database.existingSecret must be set with database.host" .existingSecret }}
                  key: {{ .existingSecretUserKey }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .existingSecret }}
                  key: {{ .existingSecretPasswordKey }}
            {{- end }}
            {{- end }}
          {{- with .Values.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
