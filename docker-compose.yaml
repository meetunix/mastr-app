services:

  mastr-app:
    image: mastr-app:latest
    pull_policy: if_not_present
    build: .
    container_name: mastr-app
    restart: on-failure
    environment:
      MASTR_STATIC_URL: https://mastr-static.nachtsieb.de
      MASTR_STATIC_PUBLIC_URL: ${MASTR_STATIC_PUBLIC_URL}
    ports:
      - "127.0.0.1:8081:8080"
